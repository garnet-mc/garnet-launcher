plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version + "+mc" + project.minecraft_version
group = 'org.garnetmc'

base { archivesName = "garnet-client" }

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' } // opus4j
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Opus codec bindings for voice chat, bundled into the jar.
    implementation "de.maxhenkel.opus4j:opus4j:${project.opus4j_version}"
    include "de.maxhenkel.opus4j:opus4j:${project.opus4j_version}"
}

loom {
    runs {
        client {
            // `./gradlew runClient -Pserver=host:port` joins a server straight away.
            if (project.hasProperty('server')) {
                programArgs '--quickPlayMultiplayer', project.property('server')
            }
            vmArg '-Dgarnet.debug=true'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

jar {
    from("../LICENSE") { rename { "${it}_garnet-client" } }
}
