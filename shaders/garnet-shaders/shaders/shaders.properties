# Garnet Shaders
# Realistic lighting for Iris: soft shadows, SSAO, volumetric light,
# reflective water, bloom and an experimental screen-space ray-traced GI.

# Shadow map
shadowMapResolution=2048
shadowDistance=160.0
shadow.culling=true

# Sky and clouds are ours
sky=true
clouds=off
sun=true
moon=true
stars=true
vignette=false
underwaterOverlay=false
oldLighting=false
separateAo=false

# Post passes run at full resolution
scale.composite1=0.5

# Options shown in the shader settings screen
screen=SHADOWS_ENABLED SHADOW_SOFTNESS <empty> AO_ENABLED AO_STRENGTH <empty> VOLUMETRIC_LIGHT VL_STRENGTH <empty> WATER_REFLECTIONS WATER_WAVES <empty> BLOOM_ENABLED BLOOM_STRENGTH <empty> RTGI_ENABLED RTGI_SAMPLES <empty> WAVING_PLANTS EXPOSURE

sliders=SHADOW_SOFTNESS AO_STRENGTH VL_STRENGTH WATER_WAVES BLOOM_STRENGTH RTGI_SAMPLES EXPOSURE

