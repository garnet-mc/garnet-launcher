<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garnet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
  <div class="noise"></div>
</div>

<header id="titlebar" data-tauri-drag-region>
  <div class="tb-left" data-tauri-drag-region>
    <img src="stone.png" alt="" class="tb-logo" data-tauri-drag-region>
    <span class="tb-title" data-tauri-drag-region>Garnet</span>
    <span class="tb-status" id="tb-status" data-tauri-drag-region></span>
  </div>
  <div class="tb-controls">
    <button class="tb-btn" id="tb-min" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button class="tb-btn" id="tb-max" title="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button class="tb-btn tb-close" id="tb-close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.3"/></svg></button>
  </div>
</header>

<div id="shell">
  <nav id="rail">
    <a href="#play" data-page="play" class="rail-item">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Play</span>
    </a>
    <a href="#servers" data-page="servers" class="rail-item">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h16v6H4z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="7" r="1"/><circle cx="8" cy="17" r="1"/></svg><span>Servers</span>
    </a>
    <a href="#mods" data-page="mods" class="rail-item">
      <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12l9-5M12 12v10M12 12L3 7" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Mods</span>
    </a>
    <a href="#shaders" data-page="shaders" class="rail-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2"/></svg><span>Shaders</span>
    </a>
    <a href="#settings" data-page="settings" class="rail-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Settings</span>
    </a>
    <div class="rail-spacer"></div>
    <button class="rail-account" id="rail-account">
      <img id="account-head" src="" alt="" hidden>
      <div class="rail-account-fallback" id="account-fallback">?</div>
      <div class="rail-account-text">
        <div class="rail-account-name" id="account-name">Not signed in</div>
        <div class="rail-account-sub" id="account-sub">Click to sign in</div>
      </div>
    </button>
  </nav>

  <main id="page"></main>
</div>

<div id="taskbar" hidden>
  <div class="task-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="task-track"/><circle cx="18" cy="18" r="15.5" class="task-fill" id="task-fill"/></svg><span id="task-pct"></span></div>
  <div class="task-text"><div id="task-phase">Working</div><div id="task-detail" class="muted"></div></div>
  <button class="link" id="task-console">Console</button>
</div>

<div id="console" hidden>
  <div class="console-head"><span>Game output</span><span class="spacer"></span><button class="link" id="console-clear">Clear</button><button class="link" id="console-close">Close</button></div>
  <pre id="console-log"></pre>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
