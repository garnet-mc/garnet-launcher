[package]
name = "garnet-launcher-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Garnet launcher desktop app"

[[bin]]
name = "garnet-launcher-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
garnet-launcher-core = { version = "0.1.0", path = "../garnet-launcher-core" }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.26.1"
